<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body> 
    <div class="wrapper">
        
        <div class="sidebar">
            <div class="add">
                <button id="add-task">Add Task<img src="svgs/star.svg" width="30px" height="30px"></button>
                <dialog id="task-dialog">
                    <div id="title-div">
                        <label for="title">Title</label>
                        <input id="title" type="text" name="task_title">
                    </div>
                    <div id="desc-div">
                        <label for="description">Description</label>
                        <textarea id="description" type="textfield" name="task_description"></textarea>
                    </div>
                    <div id="duration-div">
                        <label for="duration">Duration (minutes)</label>
                        <input id="duration" type="tel" name="task_duration">
                        <p id="error"></p>
                    </div>
                    <fieldset id="difficulty-div">
                        <legend>Difficulty</legend>
                        <label>
                            <input type="radio" name="task_difficulty" value="easy">
                            Easy
                        </label>
                        <label>
                            <input type="radio" checked name="task_difficulty" value="normal">
                            Normal
                        </label>
                        <label>
                            <input type="radio" name="task_difficulty" value="hard">
                            Hard
                        </label>
                    </fieldset>
                    <p class="task-btns">
                        <button id="close-task-btn">Close</button>
                        <button id="add-task-btn">Add</button>
                    </p>
                </dialog>
                <button id="add-project">Create Project <img src="svgs/wand.svg" width="30px" height="30px"></button>
            </div>
        </div>
        <div class="content">
            <button id="project-container">
                <p>My Project</p>
            </button>
            <button id="project-container">
                <p>My Second Project</p>
            </button>
            <button id="project-container">
                <p>My Second Project</p>
            </button>
            <button id="project-container">
                <p>My Second Project</p>
            </button>
            <button id="project-container">
                <p>My Second Project</p>
            </button>
        </div>
    </div>
</body>
</html>
